<svg xmlns="http://www.w3.org/2000/svg" width="900" height="505" viewBox="0 0 900 505" role="img" aria-labelledby="title desc"><title id="title">Agent latency p50 and p95 by selected full batches</title><desc id="desc">The final email batch median was 9.5 seconds, p95 36.5 seconds; one correct trial took 375.1 seconds. The initial email p95 was 211.5 seconds.</desc><rect x="0" y="0" width="900" height="505" rx="0" fill="#ffffff" stroke="none"/><text x="34" y="40" font-family="Arial, sans-serif" font-size="24" fill="#142c3d" font-weight="bold" text-anchor="start">Agent wall latency</text><text x="34" y="65" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">Seconds on a logarithmic axis; circle = p50, diamond = p95.</text><line x1="270.0" y1="90" x2="270.0" y2="365" stroke="#e4e9ec" stroke-width="1"/><text x="270.0" y="387" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="middle">1</text><line x1="358.6" y1="90" x2="358.6" y2="365" stroke="#e4e9ec" stroke-width="1"/><text x="358.6" y="387" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="middle">3</text><line x1="455.7" y1="90" x2="455.7" y2="365" stroke="#e4e9ec" stroke-width="1"/><text x="455.7" y="387" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="middle">10</text><line x1="544.3" y1="90" x2="544.3" y2="365" stroke="#e4e9ec" stroke-width="1"/><text x="544.3" y="387" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="middle">30</text><line x1="641.4" y1="90" x2="641.4" y2="365" stroke="#e4e9ec" stroke-width="1"/><text x="641.4" y="387" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="middle">100</text><line x1="730.0" y1="90" x2="730.0" y2="365" stroke="#e4e9ec" stroke-width="1"/><text x="730.0" y="387" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="middle">300</text><text x="500" y="412" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="middle">Seconds</text><text x="34" y="123" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">Identity, 20 cases</text><line x1="379.1" y1="118" x2="518.9" y2="118" stroke="#4b70b2" stroke-width="3"/><circle cx="379.1" cy="118" r="6" fill="#4b70b2"/><polygon points="518.9,111 525.9,118 518.9,125 511.9,118" fill="#4b70b2"/><text x="758" y="123" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="start">3.9 / 21.9s</text><text x="34" y="168" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">Email, initial</text><line x1="462.9" y1="163" x2="701.8" y2="163" stroke="#b5673a" stroke-width="3"/><circle cx="462.9" cy="163" r="6" fill="#b5673a"/><polygon points="701.8,156 708.8,163 701.8,170 694.8,163" fill="#b5673a"/><text x="758" y="168" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="start">10.9 / 211.5s</text><text x="34" y="213" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">Email, before wording</text><line x1="422.9" y1="208" x2="509.6" y2="208" stroke="#b5673a" stroke-width="3"/><circle cx="422.9" cy="208" r="6" fill="#b5673a"/><polygon points="509.6,201 516.6,208 509.6,215 502.6,208" fill="#b5673a"/><text x="758" y="213" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="start">6.7 / 19.5s</text><text x="34" y="258" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">Email, final</text><line x1="451.5" y1="253" x2="560.1" y2="253" stroke="#b5673a" stroke-width="3"/><circle cx="451.5" cy="253" r="6" fill="#b5673a"/><polygon points="560.1,246 567.1,253 560.1,260 553.1,253" fill="#b5673a"/><text x="758" y="258" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="start">9.5 / 36.5s</text><text x="34" y="303" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">Recall, initial</text><line x1="330.5" y1="298" x2="384.1" y2="298" stroke="#348877" stroke-width="3"/><circle cx="330.5" cy="298" r="6" fill="#348877"/><polygon points="384.1,291 391.1,298 384.1,305 377.1,298" fill="#348877"/><text x="758" y="303" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="start">2.1 / 4.1s</text><text x="34" y="348" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">Recall, after guard</text><line x1="327.7" y1="343" x2="398.1" y2="343" stroke="#348877" stroke-width="3"/><circle cx="327.7" cy="343" r="6" fill="#348877"/><polygon points="398.1,336 405.1,343 398.1,350 391.1,343" fill="#348877"/><text x="758" y="348" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="start">2.0 / 4.9s</text><rect x="34" y="438" width="832" height="47" rx="5" fill="#fff2e8" stroke="none"/><text x="48" y="458" font-family="Arial, sans-serif" font-size="13" fill="#8b4a22" font-weight="bold" text-anchor="start">Tail event:</text><text x="130" y="458" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">one final email trial took 375.1s, beyond the plotted p95.</text><text x="48" y="477" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="start">Two successful provider responses took 175.3s and 199.7s.</text></svg>
