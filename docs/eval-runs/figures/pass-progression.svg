<svg xmlns="http://www.w3.org/2000/svg" width="900" height="508" viewBox="0 0 900 508" role="img" aria-labelledby="title desc"><title id="title">Live evaluation pass counts by path and batch</title><desc id="desc">Identity first 17 of 18 and expanded 56 of 60; email initial 18 of 30, before wording fix 24 of 30, final 29 of 30; recall initial 25 of 30 and after guard 29 of 30.</desc><rect x="0" y="0" width="900" height="508" rx="0" fill="#ffffff" stroke="none"/><text x="34" y="40" font-family="Arial, sans-serif" font-size="24" fill="#142c3d" font-weight="bold" text-anchor="start">Observed passes in full live batches</text><text x="34" y="65" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">Bars show the recorded raw score in each run; repeated trials and changed graders limit causal comparisons.</text><text x="34" y="104" font-family="Arial, sans-serif" font-size="17" fill="#4b70b2" font-weight="bold" text-anchor="start">Shipment identity</text><text x="54" y="139" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">First 6 cases</text><rect x="260" y="122" width="440" height="23" rx="4" fill="#e8edf0" stroke="none"/><rect x="260" y="122" width="416" height="23" rx="4" fill="#4b70b2" stroke="none"/><text x="714" y="139" font-family="Arial, sans-serif" font-size="14" fill="#142c3d" font-weight="bold" text-anchor="start">17/18  (94%)</text><text x="54" y="174" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">Expanded 20 cases</text><rect x="260" y="157" width="440" height="23" rx="4" fill="#e8edf0" stroke="none"/><rect x="260" y="157" width="411" height="23" rx="4" fill="#4b70b2" stroke="none"/><text x="714" y="174" font-family="Arial, sans-serif" font-size="14" fill="#142c3d" font-weight="bold" text-anchor="start">56/60  (93%)</text><text x="34" y="212" font-family="Arial, sans-serif" font-size="17" fill="#b5673a" font-weight="bold" text-anchor="start">Email response + effects</text><text x="54" y="247" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">Initial raw grader</text><rect x="260" y="230" width="440" height="23" rx="4" fill="#e8edf0" stroke="none"/><rect x="260" y="230" width="264" height="23" rx="4" fill="#b5673a" stroke="none"/><text x="714" y="247" font-family="Arial, sans-serif" font-size="14" fill="#142c3d" font-weight="bold" text-anchor="start">18/30  (60%)</text><text x="54" y="282" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">Before wording fix</text><rect x="260" y="265" width="440" height="23" rx="4" fill="#e8edf0" stroke="none"/><rect x="260" y="265" width="352" height="23" rx="4" fill="#b5673a" stroke="none"/><text x="714" y="282" font-family="Arial, sans-serif" font-size="14" fill="#142c3d" font-weight="bold" text-anchor="start">24/30  (80%)</text><text x="54" y="317" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">Final full run</text><rect x="260" y="300" width="440" height="23" rx="4" fill="#e8edf0" stroke="none"/><rect x="260" y="300" width="425" height="23" rx="4" fill="#b5673a" stroke="none"/><text x="714" y="317" font-family="Arial, sans-serif" font-size="14" fill="#142c3d" font-weight="bold" text-anchor="start">29/30  (97%)</text><text x="34" y="355" font-family="Arial, sans-serif" font-size="17" fill="#348877" font-weight="bold" text-anchor="start">Recall interpretation</text><text x="54" y="390" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">Initial</text><rect x="260" y="373" width="440" height="23" rx="4" fill="#e8edf0" stroke="none"/><rect x="260" y="373" width="367" height="23" rx="4" fill="#348877" stroke="none"/><text x="714" y="390" font-family="Arial, sans-serif" font-size="14" fill="#142c3d" font-weight="bold" text-anchor="start">25/30  (83%)</text><text x="54" y="425" font-family="Arial, sans-serif" font-size="13" fill="#263849" font-weight="normal" text-anchor="start">After range guard</text><rect x="260" y="408" width="440" height="23" rx="4" fill="#e8edf0" stroke="none"/><rect x="260" y="408" width="425" height="23" rx="4" fill="#348877" stroke="none"/><text x="714" y="425" font-family="Arial, sans-serif" font-size="14" fill="#142c3d" font-weight="bold" text-anchor="start">29/30  (97%)</text><line x1="34" y1="465" x2="870" y2="465" stroke="#d5dce2" stroke-width="1"/><text x="34" y="488" font-family="Arial, sans-serif" font-size="12" fill="#263849" font-weight="normal" text-anchor="start">Initial email score used an earlier grader; the final run uses tightened reply wording labels.</text></svg>
