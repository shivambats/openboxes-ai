# Requires Docker Compose 2.24.4+ (!override). Use with docker-compose.yml.
services:
  app:
    image: openboxes-sidecar:local
    build:
      context: .
      dockerfile: Dockerfile
    ports: !override
      - "8081:8080"
    environment:
      SIDECAR_SANDBOX_ENABLED: "true"
      GRAILS_SERVER_URL: http://localhost/openboxes/
